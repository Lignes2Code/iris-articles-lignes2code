services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile
    image: iris-articles-lignes2code:latest
    container_name: iris-articles
    hostname: iris-articles
    ports:
      - "52773:52773"
      - "1972:1972"
    volumes:
      # Dossier data unique (input + output sur le même filesystem pour le rename)
      - ./data:/home/irisowner/data
      - ./data/durable:/dur
    environment:
      # the durable %SYS directory
      - ISC_DATA_DIRECTORY=/dur/iris_conf.d
    cap_add:
      - IPC_LOCK
    restart: unless-stopped
    stop_grace_period: 30s
